<!DOCTYPE html>
<!--
  avatar.html — Mr Odd Ball's desktop overlay.
  Author: LB   Date: 2026-08-21

  Served by ui/server.py at http://127.0.0.1:8000/ui and opened by launch_ui.py in a
  frameless, transparent pywebview window. NOT Chromium: a Chromium window for a 120px ball
  costs ~250MB and a core, which on a Pi 5 that is also running whisper and piper is the
  whole budget. pywebview wraps the system WebKit view that is already resident.

  This is the SMALL face. hud/face-preview.html is the full character rig with the chat
  column and the card panel, and it stays where it is on port 8765. This one is the
  always-on-top presence: one ball, three states, no text.

  State comes from ws://<host>/ws/state as a bare string, mirrored out of
  orchestrator/hud_bridge.set_state() so the overlay and the rig cannot disagree about what
  he is doing. The engine's vocabulary is larger than this page's — sleeping, idle,
  listening, thinking, speaking — and anything that is not "thinking" or "speaking" resting
  as a still ball is correct, not a gap.
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mr. Odd Ball Desktop Avatar</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: transparent;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #ball {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #00f2fe, #4facfe, #000);
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.6);
            transition: all 0.3s ease;
        }
        .thinking {
            animation: roll 1.2s infinite alternate ease-in-out;
        }
        @keyframes roll {
            0% { transform: translateX(-80px) rotate(-360deg); }
            100% { transform: translateX(80px) rotate(360deg); }
        }
        .speaking {
            animation: bounce 0.4s infinite alternate ease-in-out;
        }
        @keyframes bounce {
            0% { transform: translateY(0px) scaleY(1); }
            100% { transform: translateY(-35px) scaleY(0.9); }
        }
        /* He is asleep until the wake word fires, and a dimmed ball is how you can tell at a
           glance across the room. Not in the original three states; added because "idle" and
           "sleeping" looking identical is the same misleading-face problem D41 argues about
           for the main rig. */
        .sleeping {
            opacity: 0.35;
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.2);
        }
        /* No socket. Distinguishable from sleeping, or a dead server looks like a nap. */
        .offline {
            opacity: 0.25;
            filter: grayscale(1);
        }
    </style>
</head>
<body>
    <div id="ball"></div>
    <script>
        const ball = document.getElementById("ball");

        // Only these two animate. Everything else the engine broadcasts — idle, listening,
        // and any state added later — leaves him a still ball, which is the honest default
        // for a state this page has no drawing for.
        const ANIMATED = { thinking: "thinking", speaking: "speaking", sleeping: "sleeping" };

        function setState(state) {
            ball.className = ANIMATED[state] || "";
        }

        // Reconnect, because the alternative is a window that silently stops updating and
        // sits in whatever state it last heard. That exact failure is written up in
        // orchestrator/hud_bridge.py for the main rig; there is no reason to relearn it here.
        let socket = null;
        let retry = 500;

        function connect() {
            socket = new WebSocket("ws://" + window.location.host + "/ws/state");

            socket.onopen = () => { retry = 500; };

            socket.onmessage = (event) => {
                const state = event.data;
                setState(state);
            };

            socket.onclose = () => {
                ball.className = "offline";
                setTimeout(connect, retry);
                retry = Math.min(retry * 2, 8000);   // back off, do not hammer a dead port
            };

            socket.onerror = () => { socket.close(); };
        }

        connect();
    </script>
</body>
</html>
