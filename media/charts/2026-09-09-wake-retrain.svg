<text x="704.2" y="155" font-size="10.5" fill="#1f7a4d">0.2</text>
<text x="24.0" y="500.0" font-size="11.5" fill="#0b0b0b">At 0.2 the new model answers 25 of 53 real calls (47%) with 0 false fires. The old model answered 30 there &#8212; but could never have</text>
<text x="24.0" y="517.0" font-size="11.5" fill="#0b0b0b">been RUN there, because its loudest not-call peaked at 0.8214. 0.05 is the lowest swept threshold that still false-fires on</text>
<text x="24.0" y="534.0" font-size="11.5" fill="#0b0b0b">nothing, and answers 28: 3 more calls than 0.2, at no measured cost.</text>
<text x="24.0" y="555.0" font-size="10.5" fill="#52514e">The 25 still missed there are off-axis, mid-sentence and quiet. A more conservative model cannot recover them &#8212; a second stage has to. Data:</text>
<text x="24.0" y="570.0" font-size="10.5" fill="#52514e">media/data/2026-09-09-wake-retrain-compare.csv + 2026-09-07-wake-fixtures.csv &#8212; regenerate with python media/scripts/compare_wake_models.py</text>
<text x="24.0" y="585.0" font-size="10.5" fill="#52514e">then python media/scripts/plot_wake_retrain.py</text>
</svg>