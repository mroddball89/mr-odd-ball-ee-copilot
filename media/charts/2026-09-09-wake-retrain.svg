<svg xmlns="http://www.w3.org/2000/svg" width="960" height="632" viewBox="0 0 960 632" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<rect width="960" height="632" fill="#fcfcfb"/>
<text x="24" y="34" font-size="17" font-weight="600" fill="#0b0b0b">The retrain separated the classes; it did not make him hear better</text>
<text x="24.0" y="55.0" font-size="12" fill="#52514e">77 clips scored by the real ONNX model. Old = hey_mr_odd_ball.2026-08-11.onnx (synthetic training set), new = 2026-09-09,</text>
<text x="24.0" y="72.0" font-size="12" fill="#52514e">retrained on 60+ real calls with LB&#8217;s own false fires as hard negatives. Real calls = 53, INCLUDING the 4 across-the-room and 2</text>
<text x="24.0" y="89.0" font-size="12" fill="#52514e">&#8220;Mister Odd Ball&#8221; clips; not-calls = 24, including hey-mr-on-call, a deliberate near-miss phrase. Counting those 6 hard clips as</text>
<text x="24.0" y="106.0" font-size="12" fill="#52514e">calls is the stricter accounting &#8212; it lowers the recall line everywhere. Measured 2026-09-09.</text>
<text x="24" y="138" font-size="13.5" font-weight="600" fill="#0b0b0b">Threshold sweep &#8212; what fires, out of 53 real calls and 24 not-calls</text>
<text x="660" y="138" font-size="13.5" font-weight="600" fill="#0b0b0b">Loudest score each class reaches</text>
