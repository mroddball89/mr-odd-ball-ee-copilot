<text x="24" y="34" font-size="17" font-weight="600" fill="#0b0b0b">OCR render DPI buys nothing above 150</text>
<text x="24" y="55" font-size="12" fill="#52514e">Characters recovered from the two image-only PDFs in data/. RapidOCR resizes to its detector&#8217;s input size, so a bigger raster is downsampled back.</text>
<text x="24" y="73" font-size="12" fill="#52514e">Windows 11, Ryzen 7 5700X, CPU only. rapidocr-onnxruntime via pypdfium2. Measured 2026-08-29 &#8212; tools/pdf_ocr.py ships 200 dpi.</text>
