<text x="690" y="144.0" font-size="10.5" fill="#52514e">20/day &#8212; the whole free tier (D3)</text>
<text x="24" y="486" font-size="11" fill="#52514e">The first answer of a session costs 357 ms, which is <tspan font-style="italic">import sympy</tspan> and is paid once.</text>
<text x="24" y="506" font-size="11" fill="#52514e">Data: media/data/2026-09-02-quiz-marking.csv &#8212; regenerate with python media/scripts/measure_quiz_marking.py then python media/scripts/plot_quiz_marking.py</text>
