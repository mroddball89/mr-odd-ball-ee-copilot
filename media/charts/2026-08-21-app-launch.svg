<text x="266.0" y="386.0" font-size="13" font-weight="600" fill="#1B1B1B" text-anchor="middle" font-family="Consolas, monospace">firefox &amp;</text>
<text x="266.0" y="404.0" font-size="11" fill="#666666" text-anchor="middle">never started</text>
<rect x="353.7" y="96.0" width="78" height="250.0" fill="#4F8A5B" rx="3"/>
<text x="392.7" y="86.0" font-size="16" font-weight="600" fill="#1B1B1B" text-anchor="middle">5/5</text>
