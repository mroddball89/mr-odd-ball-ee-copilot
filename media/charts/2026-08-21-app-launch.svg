<text x="392.7" y="404.0" font-size="11" fill="#666666" text-anchor="middle">never started</text>
<line x1="76" y1="346" x2="456" y2="346" stroke="#1B1B1B" stroke-width="1.5"/>
<text x="528" y="80" font-size="14" font-weight="600" fill="#1B1B1B">...and what he said about it</text>
<rect x="528" y="96" width="432" height="70" rx="5" fill="#C0504D" fill-opacity="0.10" stroke="#C0504D" stroke-width="1.2"/>
<text x="542" y="117" font-size="11" fill="#666666" font-family="Consolas, monospace">firefox</text>
<text x="542" y="139" font-size="14" fill="#1B1B1B" font-style="italic">“That didn't work — the error is on the screen.</text>
<text x="542" y="157" font-size="14" fill="#1B1B1B" font-style="italic">”</text>
<rect x="528" y="182" width="432" height="70" rx="5" fill="#E8A33D" fill-opacity="0.10" stroke="#E8A33D" stroke-width="1.2"/>
<text x="542" y="203" font-size="11" fill="#666666" font-family="Consolas, monospace">firefox &amp;</text>
<text x="542" y="225" font-size="14" fill="#1B1B1B" font-style="italic">“Done. The output's on the screen.</text>
<text x="542" y="243" font-size="14" fill="#1B1B1B" font-style="italic">”</text>
<rect x="528" y="268" width="432" height="70" rx="5" fill="#4F8A5B" fill-opacity="0.10" stroke="#4F8A5B" stroke-width="1.2"/>
<text x="542" y="289" font-size="11" fill="#666666" font-family="Consolas, monospace">launch_app</text>
<text x="542" y="311" font-size="14" fill="#1B1B1B" font-style="italic">“Opening Firefox now.</text>
<text x="542" y="329" font-size="14" fill="#1B1B1B" font-style="italic">”</text>
<text x="76" y="520" font-size="12" fill="#7A4A12">The middle method is the one that was reported: the shell returns 0 immediately, Firefox dies unseen, and he says “Done.”</text>
<text x="76" y="540" font-size="12" fill="#666666">A confident success is the one failure shape nobody escalates. Data: media/data/2026-08-21-app-launch.csv</text>
</svg>