<text x="64" y="100.0" font-size="12" fill="#666666" text-anchor="end">5</text>
<text x="30" y="221.0" font-size="12" fill="#666666" text-anchor="middle" transform="rotate(-90 30 221.0)">trials with the app running</text>
<line x1="100.3" y1="346" x2="178.3" y2="346" stroke="#C0504D" stroke-width="3"/>
<text x="139.3" y="336.0" font-size="16" font-weight="600" fill="#1B1B1B" text-anchor="middle">0/5</text>
