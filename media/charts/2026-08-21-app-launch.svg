<text x="139.3" y="386.0" font-size="13" font-weight="600" fill="#1B1B1B" text-anchor="middle" font-family="Consolas, monospace">firefox</text>
<text x="139.3" y="404.0" font-size="11" fill="#666666" text-anchor="middle">never started</text>
