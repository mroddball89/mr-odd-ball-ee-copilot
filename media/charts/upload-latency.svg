<svg xmlns="http://www.w3.org/2000/svg" width="780" height="434" viewBox="0 0 780 434" font-family="DejaVu Sans, Segoe UI, sans-serif">
<rect width="780" height="434" fill="#ffffff"/>
<text x="24" y="30" font-size="17" font-weight="600" fill="#111">How long the paperclip is dead — POST /upload round trip by file size</text>
<text x="24" y="50" font-size="12" fill="#555">DESKTOP-3NFU5EK · loopback · median of 3 trials · incompressible payload · measured 2026-08-23</text>
<text x="24" y="68" font-size="12" fill="#555">Timed: form sent → reply read. Not timed: the file dialog, or the background index rebuild.</text>
<text x="178" y="110" font-size="13" text-anchor="end" fill="#222">16 KB</text>
<text x="178" y="124" font-size="10.5" text-anchor="end" fill="#888">a KiCad schematic</text>
<rect x="190" y="92" width="3.4" height="26" fill="#4facfe" rx="3"/>
<text x="203.4" y="110" font-size="12.5" fill="#333">2 ms <tspan fill="#888">· 11 MB/s</tspan></text>
<text x="178" y="151" font-size="13" text-anchor="end" fill="#222">256 KB</text>
<text x="178" y="165" font-size="10.5" text-anchor="end" fill="#888">a short syllabus</text>
<rect x="190" y="133" width="4.1" height="26" fill="#4facfe" rx="3"/>
<text x="204.1" y="151" font-size="12.5" fill="#333">2 ms <tspan fill="#888">· 149 MB/s</tspan></text>
<text x="178" y="192" font-size="13" text-anchor="end" fill="#222">1 MB</text>
<text x="178" y="206" font-size="10.5" text-anchor="end" fill="#888">a typical datasheet</text>
<rect x="190" y="174" width="9.2" height="26" fill="#4facfe" rx="3"/>
<text x="209.2" y="192" font-size="12.5" fill="#333">4 ms <tspan fill="#888">· 265 MB/s</tspan></text>
<text x="178" y="233" font-size="13" text-anchor="end" fill="#222">4 MB</text>
<text x="178" y="247" font-size="10.5" text-anchor="end" fill="#888">a long reference manual</text>
<rect x="190" y="215" width="15.3" height="26" fill="#4facfe" rx="3"/>
<text x="215.3" y="233" font-size="12.5" fill="#333">7 ms <tspan fill="#888">· 624 MB/s</tspan></text>
<text x="178" y="274" font-size="13" text-anchor="end" fill="#222">16 MB</text>
<text x="178" y="288" font-size="10.5" text-anchor="end" fill="#888">a gerber bundle</text>
<rect x="190" y="256" width="52.4" height="26" fill="#e8a33d" rx="3"/>
<text x="252.4" y="274" font-size="12.5" fill="#333">23 ms <tspan fill="#888">· 733 MB/s</tspan></text>
<text x="178" y="315" font-size="13" text-anchor="end" fill="#222">60 MB</text>
<text x="178" y="329" font-size="10.5" text-anchor="end" fill="#888">just under the 64 MB cap</text>
<rect x="190" y="297" width="415.0" height="26" fill="#e8a33d" rx="3"/>
<text x="615.0" y="315" font-size="12.5" fill="#333">181 ms <tspan fill="#888">· 347 MB/s</tspan></text>
<line x1="24" y1="350" x2="756" y2="350" stroke="#e2e2e2"/>
<text x="24" y="374" font-size="11.5" fill="#666">The curve is flat in the sizes that matter: a schematic and a datasheet are both well under a tenth of a second, so the button</text>
<text x="24" y="391" font-size="11.5" fill="#666">never visibly greys out. Reading the whole body into memory and refusing anything over 64 MB is paid for at the top rung only.</text>
<text x="24" y="414" font-size="11" fill="#999">media/scripts/measure_upload.py → 2026-08-23-upload-latency.csv → upload-latency.svg</text>
</svg>